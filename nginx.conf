server {
    listen 80;
    root /usr/share/nginx/html;

    # /landing serves landing.html; other extensionless paths fall back to .html files.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Written at container start from env vars, so it must never be cached.
    location = /runtime-config.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # HTML points at hashed JS/CSS, so it must revalidate on every load or browsers keep stale pages.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
