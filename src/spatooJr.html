<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spatooJr</title>
    <!-- Runtime settings from the container (APP_* env vars). Must load before the module script. -->
    <script src="/runtime-config.js"></script>
</head>
<body>
    <canvas class="webgl"></canvas>
    <main id="panel">
        <canvas id="logo"></canvas>
        <nav>
            <a href="/aboutUs.html">Who Are We</a>
            <a href="#">Our Games</a>
            <span class="soon">Blog (Coming Soon)</span>
        </nav>
    </main>
    <!-- Black at start; fades in on arrival. Set up in spatooJr.js. -->
    <div id="fade"></div>
    <button id="debugToggle" type="button" aria-pressed="true">Hide panel</button>
    <script type="module" src="./spatooJr.js"></script>
</body>
</html>
